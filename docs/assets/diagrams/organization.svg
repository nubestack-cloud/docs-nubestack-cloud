  <title id="dg-title">How an organization is organized</title>
  <desc id="dg-desc">The organization Acme has members, service accounts and projects. Its members are Ayesha, the owner, Bilal, an admin, Sara, a member, and Hina, with the billing role. It has one service account, automation-prod. It has two projects: web-shop, in Karachi, which holds instances, networks, volumes, load balancers, certificates and more; and analytics, in Islamabad.</desc>
