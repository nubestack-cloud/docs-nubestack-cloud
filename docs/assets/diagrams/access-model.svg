<svg class="cloud-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 385" role="img" aria-labelledby="access-model-title access-model-desc"><title id="access-model-title">Organization roles and project roles</title><desc id="access-model-desc">Organization roles govern organization administration. Project roles separately govern resource access within projects in all their locations.</desc><style>.diagram-bg{fill:var(--docs-surface,#f8fafb);stroke:var(--docs-border,#dce5ea)}.diagram-card{fill:var(--md-default-bg-color,#fff);stroke:var(--docs-border,#dce5ea);stroke-width:1.5}.diagram-title{fill:var(--docs-heading,#152735);font:600 16px system-ui,sans-serif}.diagram-small{fill:var(--docs-muted,#596876);font:13px system-ui,sans-serif}.diagram-label{fill:var(--md-typeset-a-color,#245f60);font:600 12px system-ui,sans-serif;letter-spacing:1px}.diagram-line{fill:none;stroke:var(--docs-line,#8ba6ad);stroke-width:2}.diagram-accent{fill:var(--docs-tint,#e6f2ef);stroke:var(--docs-accent,#3c7f7c)}.diagram-ink{fill:var(--md-typeset-a-color,#245f60)}</style><defs><marker id="access-model-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8ba6ad"/></marker></defs><text x="24" y="32" class="diagram-label" text-anchor="start">TWO INDEPENDENT ACCESS DECISIONS</text><rect x="24" y="85" width="245" height="100" rx="10" class="diagram-card"/><text x="42" y="114" class="diagram-title" text-anchor="start">Organization role</text><text x="42" y="137" class="diagram-small" text-anchor="start">Manage people, policy and budgets</text><rect x="24" y="210" width="245" height="100" rx="10" class="diagram-accent"/><text x="42" y="239" class="diagram-title" text-anchor="start">Project role</text><text x="42" y="262" class="diagram-small" text-anchor="start">Read or change project resources</text><path d="M271 135H354" class="diagram-line" marker-end="url(#access-model-arrow)"/><path d="M271 260H354" class="diagram-line" marker-end="url(#access-model-arrow)"/><rect x="358" y="85" width="245" height="100" rx="10" class="diagram-card"/><text x="376" y="114" class="diagram-title" text-anchor="start">Organization workspace</text><text x="376" y="137" class="diagram-small" text-anchor="start">Members, settings, usage</text><rect x="358" y="210" width="245" height="100" rx="10" class="diagram-card"/><text x="376" y="239" class="diagram-title" text-anchor="start">Project workspace</text><text x="376" y="262" class="diagram-small" text-anchor="start">Instances, networks and storage</text><text x="24" y="353" class="diagram-small" text-anchor="start">An organization admin needs a project grant to change its cloud resources.</text></svg>
