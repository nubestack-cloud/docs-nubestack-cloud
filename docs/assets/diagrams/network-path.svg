<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="dn-title dn-desc">
  <title id="dn-title">How traffic reaches your instances and the Internet</title>
  <desc id="dn-desc">In one location, the project's private routing joins its networks. An Internet gateway lets instances reach the Internet through a shared outbound address. A public IP brings traffic from the Internet to one instance, here web-1 on the network app. web-2 has no public IP: it can reach out through the gateway but cannot be reached from the Internet.</desc>
  <defs>
    <marker id="dn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L8 4L0 8z"/></marker>
    <marker id="dn-arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow-teal" d="M0 0L8 4L0 8z"/></marker>
  </defs>
  <rect class="d-box" x="10" y="122" width="116" height="44" rx="22"/>
  <text class="d-title" x="68" y="149" text-anchor="middle">Internet</text>

  <rect class="d-box" x="180" y="40" width="186" height="56" rx="8"/>
  <text class="d-title" x="196" y="64">Internet gateway</text>
  <text class="d-muted" x="196" y="83">outbound via 198.51.100.2</text>
  <rect class="d-box-teal" x="180" y="196" width="186" height="56" rx="8"/>
  <text class="d-title" x="196" y="220">Public IP</text>
  <text class="d-muted" x="196" y="239">203.0.113.21 → web-1</text>

  <rect class="d-box" x="412" y="40" width="164" height="56" rx="8"/>
  <text class="d-title" x="428" y="64">Private routing</text>
  <text class="d-muted" x="428" y="83">joins your networks</text>

  <rect class="d-zone-teal" x="618" y="16" width="172" height="262" rx="10"/>
  <text class="d-label" x="634" y="40">Network · app</text>
  <text class="d-muted d-mono" x="634" y="58">10.0.0.0/24</text>
  <rect class="d-box" x="634" y="96" width="140" height="56" rx="8"/>
  <text class="d-title" x="650" y="120">web-1</text>
  <text class="d-muted d-mono" x="650" y="139">10.0.0.11</text>
  <rect class="d-box" x="634" y="196" width="140" height="56" rx="8"/>
  <text class="d-title" x="650" y="220">web-2</text>
  <text class="d-muted d-mono" x="650" y="239">10.0.0.12</text>

  <path class="d-line" d="M180 68C150 68 150 132 126 138" marker-end="url(#dn-arrow)"/>
  <text class="d-muted" x="132" y="92">out</text>
  <path class="d-flow" d="M126 150C150 156 150 224 180 224" marker-end="url(#dn-arrow-teal)"/>
  <text class="d-muted" x="132" y="206">in</text>
  <path class="d-line" d="M412 68H366" marker-end="url(#dn-arrow)"/>
  <path class="d-line" d="M618 68H576" marker-end="url(#dn-arrow)"/>
  <path class="d-flow" d="M366 224H596V124H634" marker-end="url(#dn-arrow-teal)"/>
</svg>
