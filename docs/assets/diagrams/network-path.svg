<svg class="cloud-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="network-path-title network-path-desc"><title id="network-path-title">A public connection to an instance</title><desc id="network-path-desc">An inbound connection uses a public IP and Internet gateway to reach a routed network. The instance security group must allow the port.</desc><style>.diagram-bg{fill:var(--docs-surface,#f8fafb);stroke:var(--docs-border,#dce5ea)}.diagram-card{fill:var(--md-default-bg-color,#fff);stroke:var(--docs-border,#dce5ea);stroke-width:1.5}.diagram-title{fill:var(--docs-heading,#152735);font:600 16px system-ui,sans-serif}.diagram-small{fill:var(--docs-muted,#596876);font:13px system-ui,sans-serif}.diagram-label{fill:var(--md-typeset-a-color,#245f60);font:600 12px system-ui,sans-serif;letter-spacing:1px}.diagram-line{fill:none;stroke:var(--docs-line,#8ba6ad);stroke-width:2}.diagram-accent{fill:var(--docs-tint,#e6f2ef);stroke:var(--docs-accent,#3c7f7c)}.diagram-ink{fill:var(--md-typeset-a-color,#245f60)}</style><defs><marker id="network-path-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8ba6ad"/></marker></defs><text x="24" y="34" class="diagram-label" text-anchor="start">HOW TRAFFIC REACHES AN INSTANCE</text><rect x="24" y="110" width="142" height="72" rx="10" class="diagram-card"/><text x="42" y="139" class="diagram-title" text-anchor="start">Your computer</text><text x="42" y="162" class="diagram-small" text-anchor="start">SSH or HTTPS</text><path d="M168 146H212" class="diagram-line" marker-end="url(#network-path-arrow)"/><rect x="214" y="110" width="154" height="72" rx="10" class="diagram-accent"/><text x="232" y="139" class="diagram-title" text-anchor="start">Public IP</text><text x="232" y="162" class="diagram-small" text-anchor="start">Allocated address</text><path d="M369 146H414" class="diagram-line" marker-end="url(#network-path-arrow)"/><rect x="416" y="65" width="440" height="220" rx="14" class="diagram-bg"/><text x="438" y="94" class="diagram-label" text-anchor="start">PROJECT · ONE LOCATION</text><rect x="438" y="110" width="170" height="72" rx="10" class="diagram-card"/><text x="456" y="139" class="diagram-title" text-anchor="start">Internet gateway</text><text x="456" y="162" class="diagram-small" text-anchor="start">Internet path</text><path d="M610 146H650" class="diagram-line" marker-end="url(#network-path-arrow)"/><rect x="652" y="110" width="180" height="72" rx="10" class="diagram-card"/><text x="670" y="139" class="diagram-title" text-anchor="start">Instance</text><text x="670" y="162" class="diagram-small" text-anchor="start">Private network address</text><text x="652" y="211" class="diagram-small" text-anchor="start">Security group allows the port</text><text x="438" y="254" class="diagram-small" text-anchor="start">A route provides a path. A security group permits traffic.</text></svg>
