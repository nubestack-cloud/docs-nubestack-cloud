<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" role="img" aria-labelledby="dw-title dw-desc">
  <title id="dw-title">A web tier and a database on two private networks</title>
  <desc id="dw-desc">In Karachi, the project has two routed networks joined by its private router. On the network app, 10.0.0.0/24, the instance web-1 is in the security group web, which allows TCP 80 and 443 from anywhere and SSH from the office range 203.0.113.0/24; web-1 has a new public IP, so the Internet reaches it on 80 and 443 and the office reaches it by SSH. On the network db, 10.0.1.0/24, the instance db-1 at 10.0.1.10 is in the security group db, which allows TCP 5432 only from instances in the group web, so web-1 reaches the database through the router. db-1 has no public IP: it reaches the Internet for updates through the project's Internet gateway, and nothing on the Internet can reach it.</desc>
