<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" role="img" aria-labelledby="do-title do-desc">
  <title id="do-title">The life of an operation</title>
  <desc id="do-desc">You send a change. NubeStack Cloud answers 202 Accepted with an operation in the state queued. The operation becomes running, then ends as succeeded, partially succeeded or failed. While it is still queued, it can be cancelled: cancelling, then cancelled. The end states never change.</desc>
  <defs>
    <marker id="do-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L8 4L0 8z"/></marker>
  </defs>

  <rect class="d-box" x="10" y="96" width="140" height="44" rx="22"/>
  <svg x="24" y="109" width="18" height="18" viewBox="0 0 24 24"><path class="d-glyph" d="m4 6.03 7.5 3.22-7.5-1zm7.5 8.72L4 17.97v-2.22zM2 3v7l15 2-15 2v7l21-9z"/></svg>
  <text class="d-title" x="48" y="123">Your change</text>

  <rect class="d-box" x="186" y="96" width="150" height="44" rx="22"/>
  <text class="d-title d-mono" x="261" y="123" text-anchor="middle">202 Accepted</text>

  <rect class="d-box-teal" x="372" y="96" width="120" height="44" rx="22"/>
  <svg x="386" y="109" width="18" height="18" viewBox="0 0 24 24"><path class="d-glyph" d="M12 20a8 8 0 0 0 8-8 8 8 0 0 0-8-8 8 8 0 0 0-8 8 8 8 0 0 0 8 8m0-18a10 10 0 0 1 10 10 10 10 0 0 1-10 10C6.47 22 2 17.5 2 12A10 10 0 0 1 12 2m.5 5v5.25l4.5 2.67-.75 1.23L11 13V7z"/></svg>
  <text class="d-title" x="410" y="123">Queued</text>

  <rect class="d-box-teal" x="528" y="96" width="124" height="44" rx="22"/>
  <svg x="542" y="109" width="18" height="18" viewBox="0 0 24 24"><path class="d-glyph" d="M11.7 20h-.4l-.4-2.6c-1.2-.2-2.2-.9-3-1.8l-2.4 1-.8-1.3 2.1-1.6q-.6-1.8 0-3.6L4.7 8.7l.8-1.3 2.4 1q1.2-1.35 3-1.8l.3-2.6h1.5l.4 2.6c1.2.2 2.3.9 3 1.8l2.4-1 .8 1.3-2.1 1.5q.3.9.3 1.8h.5c.5 0 1 .1 1.5.2V12l-.1-1 2.1-1.6c.2-.2.2-.4.1-.6l-2-3.5c-.1-.3-.3-.3-.6-.3l-2.5 1c-.5-.4-1.1-.7-1.7-1l-.4-2.7c.1-.1-.2-.3-.4-.3h-4c-.2 0-.5.2-.5.4l-.4 2.7c-.6.2-1.1.6-1.7.9L5 5c-.3 0-.5 0-.7.3l-2 3.5c-.1.2 0 .4.2.6L4.6 11l-.1 1 .1 1-2.1 1.7c-.2.2-.2.4-.1.6l2 3.5c.1.2.3.2.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.7c0 .2.2.4.5.4h2.5c-.5-.7-.7-1.4-.9-2.1m4.3-7.7V12c0-2.2-1.8-4-4-4s-4 1.8-4 4 1.8 4 4 4c.7-1.7 2.2-3.1 4-3.7m-6-.3c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2m8 2.5V13l-2.2 2.2 2.2 2.2V16c1.4 0 2.5 1.1 2.5 2.5 0 .4-.1.8-.3 1.1l1.1 1.1c1.2-1.8.7-4.3-1.1-5.5-.6-.5-1.4-.7-2.2-.7m0 6.5c-1.4 0-2.5-1.1-2.5-2.5 0-.4.1-.8.3-1.1l-1.1-1.1c-1.2 1.8-.7 4.3 1.1 5.5.7.4 1.4.7 2.2.7V24l2.2-2.2-2.2-2.3z"/></svg>
  <text class="d-title" x="566" y="123">Running</text>

  <rect class="d-box-teal" x="690" y="22" width="200" height="44" rx="22"/>
  <svg x="704" y="35" width="18" height="18" viewBox="0 0 24 24"><path class="d-glyph d-ok" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m4.59-12.42L10 14.17l-2.59-2.58L6 13l4 4 8-8z"/></svg>
