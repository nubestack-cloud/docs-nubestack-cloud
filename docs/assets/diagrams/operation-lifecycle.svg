  <rect class="d-box" x="528" y="182" width="124" height="40" rx="20"/>
  <svg x="542" y="193" width="18" height="18" viewBox="0 0 24 24"><path class="d-glyph" d="M12 2c5.5 0 10 4.5 10 10s-4.5 10-10 10S2 17.5 2 12 6.5 2 12 2m0 2c-1.9 0-3.6.6-4.9 1.7l11.2 11.2c1-1.4 1.7-3.1 1.7-4.9 0-4.4-3.6-8-8-8m4.9 14.3L5.7 7.1C4.6 8.4 4 10.1 4 12c0 4.4 3.6 8 8 8 1.9 0 3.6-.6 4.9-1.7"/></svg>
  <text class="d-muted" x="566" y="207">Cancelled</text>

  <path class="d-flow" d="M150 118H186" marker-end="url(#do-arrow)"/>
  <path class="d-flow" d="M336 118H372" marker-end="url(#do-arrow)"/>
  <path class="d-flow" d="M492 118H528" marker-end="url(#do-arrow)"/>
  <path class="d-line" d="M652 112C676 100 670 50 690 44" marker-end="url(#do-arrow)"/>
  <path class="d-line" d="M652 118H690" marker-end="url(#do-arrow)"/>
  <path class="d-line" d="M652 124C676 136 670 186 690 192" marker-end="url(#do-arrow)"/>
  <path class="d-line d-dash" d="M432 140V182" marker-end="url(#do-arrow)"/>
  <path class="d-line d-dash" d="M492 202H528" marker-end="url(#do-arrow)"/>
  <text class="d-muted" x="440" y="166">cancel</text>
  <text class="d-muted" x="10" y="40">The answer comes at once;</text>
  <text class="d-muted" x="10" y="57">the work runs in the location.</text>
  <text class="d-label" x="690" y="12">End states never change</text>
</svg>
