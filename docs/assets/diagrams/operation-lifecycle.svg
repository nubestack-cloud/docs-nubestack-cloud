<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 236" role="img" aria-labelledby="do-title do-desc">
  <title id="do-title">The life of an operation</title>
  <desc id="do-desc">You send a change. NubeStack Cloud answers 202 Accepted with an operation in the state queued. The operation becomes running, then ends as succeeded, partially succeeded or failed. While it is still queued, it can be cancelled: cancelling, then cancelled. The end states never change.</desc>
  <defs>
    <marker id="do-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L8 4L0 8z"/></marker>
  </defs>
  <rect class="d-box" x="10" y="96" width="122" height="44" rx="22"/>
  <text class="d-title" x="71" y="123" text-anchor="middle">Your change</text>
  <rect class="d-box" x="168" y="96" width="132" height="44" rx="22"/>
  <text class="d-title d-mono" x="234" y="123" text-anchor="middle">202 Accepted</text>
  <rect class="d-box-teal" x="336" y="96" width="104" height="44" rx="22"/>
  <text class="d-title" x="388" y="123" text-anchor="middle">Queued</text>
  <rect class="d-box-teal" x="476" y="96" width="104" height="44" rx="22"/>
  <text class="d-title" x="528" y="123" text-anchor="middle">Running</text>

  <rect class="d-box-teal" x="630" y="22" width="160" height="44" rx="22"/>
  <text class="d-title" x="710" y="49" text-anchor="middle">Succeeded</text>
  <rect class="d-box" x="630" y="96" width="160" height="44" rx="22"/>
  <text class="d-title" x="710" y="123" text-anchor="middle">Partially succeeded</text>
  <rect class="d-box" x="630" y="170" width="160" height="44" rx="22"/>
  <text class="d-title" x="710" y="197" text-anchor="middle">Failed</text>

  <rect class="d-box" x="336" y="182" width="104" height="40" rx="20"/>
  <text class="d-muted" x="388" y="207" text-anchor="middle">Cancelling</text>
  <rect class="d-box" x="476" y="182" width="104" height="40" rx="20"/>
  <text class="d-muted" x="528" y="207" text-anchor="middle">Cancelled</text>

  <path class="d-line" d="M132 118H168" marker-end="url(#do-arrow)"/>
  <path class="d-line" d="M300 118H336" marker-end="url(#do-arrow)"/>
  <path class="d-line" d="M440 118H476" marker-end="url(#do-arrow)"/>
  <path class="d-line" d="M580 112C606 100 606 50 630 44" marker-end="url(#do-arrow)"/>
  <path class="d-line" d="M580 118H630" marker-end="url(#do-arrow)"/>
  <path class="d-line" d="M580 124C606 136 606 186 630 192" marker-end="url(#do-arrow)"/>
  <path class="d-line d-dash" d="M388 140V182" marker-end="url(#do-arrow)"/>
  <path class="d-line d-dash" d="M440 202H476" marker-end="url(#do-arrow)"/>
  <text class="d-muted" x="396" y="166">cancel</text>
  <text class="d-muted" x="10" y="40">The answer comes at once;</text>
  <text class="d-muted" x="10" y="57">the work runs in the location.</text>
  <text class="d-label" x="630" y="12">End states never change</text>
</svg>
