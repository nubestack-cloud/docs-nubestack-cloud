<svg class="cloud-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 255" role="img" aria-labelledby="operation-lifecycle-title operation-lifecycle-desc"><title id="operation-lifecycle-title">The lifecycle of an asynchronous cloud change</title><desc id="operation-lifecycle-desc">An accepted request returns an operation link. Poll while queued and running. At a final result inspect successful steps, failures and retained resources.</desc><style>.diagram-bg{fill:var(--docs-surface,#f8fafb);stroke:var(--docs-border,#dce5ea)}.diagram-card{fill:var(--md-default-bg-color,#fff);stroke:var(--docs-border,#dce5ea);stroke-width:1.5}.diagram-title{fill:var(--docs-heading,#152735);font:600 16px system-ui,sans-serif}.diagram-small{fill:var(--docs-muted,#596876);font:13px system-ui,sans-serif}.diagram-label{fill:var(--md-typeset-a-color,#245f60);font:600 12px system-ui,sans-serif;letter-spacing:1px}.diagram-line{fill:none;stroke:var(--docs-line,#8ba6ad);stroke-width:2}.diagram-accent{fill:var(--docs-tint,#e6f2ef);stroke:var(--docs-accent,#3c7f7c)}.diagram-ink{fill:var(--md-typeset-a-color,#245f60)}</style><defs><marker id="operation-lifecycle-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8ba6ad"/></marker></defs><text x="24" y="32" class="diagram-label" text-anchor="start">A CHANGE IS ACCEPTED BEFORE IT FINISHES</text><rect x="24" y="90" width="168" height="74" rx="10" class="diagram-accent"/><text x="42" y="119" class="diagram-title" text-anchor="start">Request accepted</text><text x="42" y="142" class="diagram-small" text-anchor="start">202 + operation link</text><path d="M194 127H239" class="diagram-line" marker-end="url(#operation-lifecycle-arrow)"/><rect x="242" y="90" width="160" height="74" rx="10" class="diagram-card"/><text x="260" y="119" class="diagram-title" text-anchor="start">Queued</text><text x="260" y="142" class="diagram-small" text-anchor="start">Waiting to start</text><path d="M404 127H449" class="diagram-line" marker-end="url(#operation-lifecycle-arrow)"/><rect x="452" y="90" width="160" height="74" rx="10" class="diagram-card"/><text x="470" y="119" class="diagram-title" text-anchor="start">Running</text><text x="470" y="142" class="diagram-small" text-anchor="start">Work in this location</text><path d="M614 127H659" class="diagram-line" marker-end="url(#operation-lifecycle-arrow)"/><rect x="662" y="90" width="190" height="74" rx="10" class="diagram-card"/><text x="680" y="119" class="diagram-title" text-anchor="start">Final result</text><text x="680" y="142" class="diagram-small" text-anchor="start">Inspect state and steps</text><text x="24" y="223" class="diagram-small" text-anchor="start">Succeeded: continue. Partial or failed: inspect what remains before trying again.</text></svg>
