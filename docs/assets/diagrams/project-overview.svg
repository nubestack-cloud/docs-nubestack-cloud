<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 448" role="img" aria-labelledby="overview-title overview-desc" class="cloud-diagram project-blueprint">
<title id="overview-title">The building blocks of a cloud application</title>
<desc id="overview-desc">An example project in Karachi: a public IP points to a load balancer, which sends traffic to two instances on a private network. A persistent volume is attached to the first instance. Security groups control allowed traffic.</desc>
