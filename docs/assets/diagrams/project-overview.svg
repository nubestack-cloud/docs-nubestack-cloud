<svg class="cloud-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" role="img" aria-labelledby="project-overview-title project-overview-desc"><title id="project-overview-title">An application inside your cloud project</title><desc id="project-overview-desc">A public IP leads to a load balancer, which distributes traffic to two instances in one project and location.</desc><style>.diagram-bg{fill:var(--docs-surface,#f8fafb);stroke:var(--docs-border,#dce5ea)}.diagram-card{fill:var(--md-default-bg-color,#fff);stroke:var(--docs-border,#dce5ea);stroke-width:1.5}.diagram-title{fill:var(--docs-heading,#152735);font:600 16px system-ui,sans-serif}.diagram-small{fill:var(--docs-muted,#596876);font:13px system-ui,sans-serif}.diagram-label{fill:var(--md-typeset-a-color,#245f60);font:600 12px system-ui,sans-serif;letter-spacing:1px}.diagram-line{fill:none;stroke:var(--docs-line,#8ba6ad);stroke-width:2}.diagram-accent{fill:var(--docs-tint,#e6f2ef);stroke:var(--docs-accent,#3c7f7c)}.diagram-ink{fill:var(--md-typeset-a-color,#245f60)}</style><defs><marker id="project-overview-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8ba6ad"/></marker></defs><rect x="12" y="12" width="596" height="354" rx="16" class="diagram-bg"/><text x="34" y="44" class="diagram-label" text-anchor="start">YOUR PROJECT</text><text x="34" y="72" class="diagram-title" text-anchor="start">web-shop</text><text x="585" y="44" class="diagram-small" text-anchor="end">Karachi · pak-khi-1</text><rect x="220" y="99" width="180" height="66" rx="10" class="diagram-accent"/><text x="238" y="128" class="diagram-title" text-anchor="start">Public IP</text><text x="238" y="151" class="diagram-small" text-anchor="start">Internet-facing address</text><path d="M310 165V194" class="diagram-line" marker-end="url(#project-overview-arrow)"/><rect x="190" y="196" width="240" height="66" rx="10" class="diagram-card"/><text x="208" y="225" class="diagram-title" t