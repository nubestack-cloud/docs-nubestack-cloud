<style>.project-blueprint text{font-family:var(--md-text-font,system-ui);fill:var(--docs-heading,#152735)}.project-blueprint .bp-small{font-size:13px;fill:var(--docs-muted,#596876)}.project-blueprint .bp-title{font-size:17px;font-weight:600}.project-blueprint .bp-card{fill:var(--md-default-bg-color,#fff);stroke:var(--docs-border,#e3e8ed)}.project-blueprint .bp-path{fill:none;stroke:var(--docs-line,#8ba6ad);stroke-width:1.6;marker-end:url(#overview-arrow)}.project-blueprint .bp-icon{fill:none;stroke:var(--docs-accent,#3c7f7c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
