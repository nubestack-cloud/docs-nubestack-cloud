<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" role="img" aria-labelledby="db-title db-desc">
  <title id="db-title">How a backup schedule keeps the newest few snapshots</title>
  <desc id="db-desc">The backup schedule nightly runs daily at 02:00, Asia/Karachi time, and keeps 7 snapshots of the volume db-data. Each snapshot is named after the schedule and the time, for example nightly-20261029-0200. Nightly snapshots from Oct 22 to Oct 30 are shown. After the Oct 29 run succeeds, the schedule has more than 7 of its own snapshots, so it deletes the oldest it made, Oct 22, and keeps the newest 7, Oct 23 to Oct 29. The Oct 30 run failed, and a failed run deletes nothing. A snapshot made by hand, or one made by another schedule, is never deleted by this schedule and is not counted in its Keeps.</desc>
  <defs>
    <marker id="db-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L8 4L0 8z"/></marker>
  </defs>

  <rect class="d-box-teal" x="20" y="10" width="300" height="56" rx="8"/>
  <rect class="d-chip-solid" x="32" y="23" width="30" height="30" rx="7"/>
  <svg x="37" y="28" width="20" height="20" viewBox="0 0 24 24"><path class="d-glyph-inv" d="M15 13h1.5v2.82l2.44 1.41-.75 1.3L15 16.69zm4-5H5v11h4.67c-.43-.91-.67-1.93-.67-3a7 7 0 0 1 7-7c1.07 0 2.09.24 3 .67zM5 21a2 2 0 0 1-2-2V5c0-1.11.89-2 2-2h1V1h2v2h8V1h2v2h1a2 2 0 0 1 2 2v6.1c1.24 1.26 2 2.99 2 4.9a7 7 0 0 1-7 7c-1.91 0-3.64-.76-4.9-2zm11-9.85A4.85 4.85 0 0 0 11.15 16c0 2.68 2.17 4.85 4.85 4.85A4.85 4.85 0 0 0 20.85 16c0-2.68-2.17-4.85-4.85-4.85"/></svg>
  <text class="d-title" x="72" y="34">nightly</text>
  <text class="d-muted" x="72" y="53">Daily at 02:00, Asia/Karachi · Keeps 7</text>

  <text class="d-muted" x="340" y="34">Each snapshot is named after the schedule and the time,</text>
  <text class="d-muted" x="340" y="51">for example <tspan class="d-mono">nightly-20261029-0200</tspan>. One volume: db-data.</text>

  <path class="d-tree" d="M114 104V96H762V104"/>
  <text class="d-tag" x="438" y="90" text-anchor="middle">Keeps 7: the newest 7 it made</text>

