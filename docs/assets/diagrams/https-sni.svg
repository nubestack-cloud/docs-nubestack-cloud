  <text class="d-title" x="534" y="174">shop-2026</text>
  <text class="d-muted" x="534" y="193">By host name (SNI)</text>

  <text class="d-muted" x="482" y="236">Up to 10 more certificates</text>
  <text class="d-muted" x="482" y="253">by host name, one default.</text>

