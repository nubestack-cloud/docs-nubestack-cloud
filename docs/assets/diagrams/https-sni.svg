<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="ds-title ds-desc">
  <title id="ds-title">One HTTPS listener serving two certificates by host name</title>
  <desc id="ds-desc">Browsers connect to the public IP 203.0.113.40. The load balancer's HTTPS listener on port 443 ends TLS. A browser asking for shop.acme.example is served the certificate shop-2026; one asking for www.acme.example, or any other name, is served the listener's default certificate, www-2026. The listener sends plain HTTP to the pool web-pool, which holds the instances web-1 and web-2 on port 8080.</desc>
  <defs>
    <marker id="ds-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow-teal" d="M0 0L8 4L0 8z"/></marker>
  </defs>
  <rect class="d-box" x="10" y="30" width="196" height="56" rx="8"/>
  <text class="d-title d-mono" x="26" y="54">shop.acme.example</text>
  <text class="d-muted" x="26" y="73">is served shop-2026</text>
  <rect class="d-box" x="10" y="122" width="196" height="56" rx="8"/>
  <text class="d-title d-mono" x="26" y="146">www.acme.example</text>
  <text class="d-muted" x="26" y="165">is served www-2026</text>
  <rect class="d-box" x="10" y="214" width="196" height="56" rx="8"/>
  <text class="d-title" x="26" y="238">Any other name</text>
  <text class="d-muted" x="26" y="257">is served the default</text>

  <rect class="d-box-teal" x="246" y="122" width="132" height="56" rx="8"/>
  <text class="d-title" x="262" y="146">Public IP</text>
  <text class="d-muted d-mono" x="262" y="165">203.0.113.40</text>

  <rect class="d-zone-teal" x="416" y="20" width="214" height="260" rx="10"/>
  <text class="d-label" x="432" y="44">HTTPS listener · 443</text>
  <text class="d-muted" x="432" y="64">Ends TLS with your certificates</text>
  <rect class="d-box" x="432" y="80" width="182" height="56" rx="8"/>
  <text class="d-title" x="448" y="104">www-2026</text>
  <text class="d-muted" x="448" y="123">Default certificate</text>
  <rect class="d-box" x="432" y="150" width="182" height="56" rx="8"/>
  <text class="d-title" x="448" y="174">shop-2026</text>
  <text class="d-muted" x="448" y="193">By host name (SNI)</text>
  <text class="d-muted" x="432" y="236">Up to 10 more certificates</text>
  <text class="d-muted" x="432" y="253">by host name, one default.</text>

  <rect class="d-zone" x="666" y="20" width="124" height="260" rx="10"/>
  <text class="d-label" x="680" y="44">web-pool</text>
  <text class="d-muted" x="680" y="64">plain HTTP</text>
  <rect class="d-box" x="680" y="80" width="96" height="56" rx="8"/>
  <text class="d-title" x="694" y="104">web-1</text>
  <text class="d-muted d-mono" x="694" y="123">:8080</text>
  <rect class="d-box" x="680" y="150" width="96" height="56" rx="8"/>
  <text class="d-title" x="694" y="174">web-2</text>
  <text class="d-muted d-mono" x="694" y="193">:8080</text>

  <path class="d-flow" d="M206 58C230 58 226 140 246 146" marker-end="url(#ds-arrow)"/>
  <path class="d-flow" d="M206 150H246" marker-end="url(#ds-arrow)"/>
  <path class="d-flow" d="M206 242C230 242 226 160 246 154" marker-end="url(#ds-arrow)"/>
  <path class="d-flow" d="M378 150H416" marker-end="url(#ds-arrow)"/>
  <path class="d-flow" d="M630 150H666" marker-end="url(#ds-arrow)"/>
</svg>
