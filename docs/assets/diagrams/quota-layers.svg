<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="dq-title dq-desc">
  <title id="dq-title">Quota in two layers</title>
  <desc id="dq-desc">In each location, Karachi pak-khi-1 and Islamabad pak-isb-1, NubeStack sets the organization's budget: how much Acme may hand out there. Acme's owners and admins share that budget between projects, so each project has its own quota in each of its locations: web-shop in Karachi; web-shop and analytics in Islamabad. A new project starts from a quota preset: the preset's figure, or what is left of the budget there, whichever is less. When a budget runs short, owners and admins ask NubeStack for more, one location at a time. Each location enforces its own quota, and quota is not capacity: a location can still be out of room.</desc>
