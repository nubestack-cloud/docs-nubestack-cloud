  <svg x="606" y="330" width="16" height="16" viewBox="0 0 24 24"><path class="d-glyph d-bad" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM8 9h8v10H8zm7.5-5-1-1h-5l-1 1H5v2h14V4z"/></svg>
  <text class="d-title" x="628" y="343">Closed</text>
  <text class="d-muted" x="608" y="363">Every project deleted in</text>
