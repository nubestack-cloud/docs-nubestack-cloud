  <svg x="27" y="107" width="20" height="20" viewBox="0 0 24 24"><path class="d-glyph-inv" d="M20 18H4V8h16m0-2h-8l-2-2H4c-1.11 0-2 .89-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2"/></svg>
