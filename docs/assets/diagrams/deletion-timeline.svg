  <svg x="782" y="330" width="16" height="16" viewBox="0 0 24 24"><path class="d-glyph" d="M13.5 8H12v5l4.28 2.54.72-1.21-3.5-2.08zM13 3a9 9 0 0 0-9 9H1l3.96 4.03L9 12H6a7 7 0 0 1 7-7 7 7 0 0 1 7 7 7 7 0 0 1-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.9 8.9 0 0 0 13 21a9 9 0 0 0 9-9 9 9 0 0 0-9-9"/></svg>
  <text class="d-title" x="804" y="343">Kept</text>
  <text class="d-muted" x="784" y="363">the audit log</text>
  <text class="d-muted" x="784" y="379">and usage</text>
  <text class="d-muted" x="784" y="395">records</text>
</svg>
