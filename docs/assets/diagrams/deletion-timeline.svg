<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 446" role="img" aria-labelledby="dt-title dt-desc">
  <title id="dt-title">What happens when a project is deleted or the organization closed</title>
  <desc id="dt-desc">Two timelines. Deleting a project, which project admins, owners and admins can do: at once the project is suspended and nothing new can be made in it. During the recovery window, 7 days unless agreed otherwise, Cancel deletion and then Resume project bring it back. When the window ends, or at once with Delete now, everything left is deleted in every location, and this cannot be cancelled once started. Afterwards, activity and usage records are kept. With Delete everything in it, instances, load balancers, public IPs, routers, networks and security groups go within minutes, while volumes, snapshots and images are kept for the window and are the only things that come back after Cancel deletion. With Delete only if empty, the deletion is refused while anything is left. Closing the organization, owners only: at once every instance stops, pending invitations are revoked and nothing can be changed, though owners can still read everything. During the recovery window, 30 days unless agreed otherwise, everything is kept, Cancel closure brings it back and an owner can request a data export of its records. When the window ends, every project is deleted in every location and every member removed; this cannot be undone. Afterwards the audit log and usage records are kept.</desc>
  <defs>
    <marker id="dt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow-teal" d="M0 0L8 4L0 8z"/></marker>
    <marker id="dt-arrow-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L8 4L0 8z"/></marker>
  </defs>

