<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" role="img" aria-labelledby="dv-title dv-desc">
  <title id="dv-title">Restoring a volume from a snapshot</title>
  <desc id="dv-desc">The volume db-data is attached to the instance db-1. A snapshot of it, db-data-before-upgrade, records its contents at one moment, on the same storage as the volume. To restore, make a new volume from the snapshot and attach it to an instance; the original volume is not changed.</desc>
  <defs>
    <marker id="dv-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow-teal" d="M0 0L8 4L0 8z"/></marker>
  </defs>
  <rect class="d-box" x="10" y="52" width="140" height="56" rx="8"/>
  <text class="d-title" x="26" y="76">db-1</text>
  <text class="d-muted" x="26" y="95">Instance</text>
  <rect class="d-box-teal" x="196" y="52" width="160" height="56" rx="8"/>
  <text class="d-title" x="212" y="76">db-data</text>
  <text class="d-muted" x="212" y="95">Volume · 100 GiB</text>
  <rect class="d-box" x="404" y="52" width="196" height="56" rx="8"/>
  <text class="d-title" x="420" y="76">db-data-before-upgrade</text>
  <text class="d-muted" x="420" y="95">Snapshot · same storage</text>
  <rect class="d-box-teal" x="648" y="52" width="142" height="56" rx="8"/>
  <text class="d-title" x="664" y="76">db-data-restored</text>
  <text class="d-muted" x="664" y="95">New volume</text>
  <path class="d-line" d="M150 80H196"/>
  <text class="d-muted" x="152" y="70">attached</text>
  <path class="d-flow" d="M356 80H404" marker-end="url(#dv-arrow)"/>
  <text class="d-muted" x="360" y="70">snapshot</text>
  <path class="d-flow" d="M600 80H648" marker-end="url(#dv-arrow)"/>
  <text class="d-muted" x="606" y="70">restore</text>
  <text class="d-muted" x="404" y="140">A snapshot shares the volume's storage: it is a recovery point,</text>
  <text class="d-muted" x="404" y="157">not a backup on separate storage.</text>
</svg>
