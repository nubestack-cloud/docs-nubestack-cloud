<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="dp-title dp-desc">
  <title id="dp-title">Server group policies</title>
  <desc id="dp-desc">A server group's policy decides where its instances start. Different hosts, anti-affinity: every instance on its own host; when no host is left, the next instance fails to start; a host may run more than one, up to 10, if you allow it. Different hosts when possible, soft-anti-affinity: spread as far as the location can; an instance shares a host rather than fail. Same host, affinity: every instance on one host; when it is full, the next one fails. Same host when possible, soft-affinity: together as far as the location can.</desc>
  <defs>
  </defs>

