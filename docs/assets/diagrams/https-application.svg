<svg class="cloud-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 300" role="img" aria-labelledby="https-application-title https-application-desc"><title id="https-application-title">An HTTPS application behind a load balancer</title><desc id="https-application-desc">A domain resolves to a public IP. The Application load balancer HTTPS listener uses a certificate and forwards traffic to a backend pool and private instances.</desc><style>.diagram-bg{fill:var(--docs-surface,#f8fafb);stroke:var(--docs-border,#dce5ea)}.diagram-card{fill:var(--md-default-bg-color,#fff);stroke:var(--docs-border,#dce5ea);stroke-width:1.5}.diagram-title{fill:var(--docs-heading,#152735);font:600 16px system-ui,sans-serif}.diagram-small{fill:var(--docs-muted,#596876);font:13px system-ui,sans-serif}.diagram-label{fill:var(--md-typeset-a-color,#245f60);font:600 12px system-ui,sans-serif;letter-spacing:1px}.diagram-line{fill:none;stroke:var(--docs-line,#8ba6ad);stroke-width:2}.diagram-accent{fill:var(--docs-tint,#e6f2ef);stroke:var(--docs-accent,#3c7f7c)}.diagram-ink{fill:var(--md-typeset-a-color,#245f60)}</style><defs><marker id="https-application-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8ba6ad"/></marker></defs><text x="24" y="32" class="diagram-label" text-anchor="start">ONE PUBLIC ENDPOINT, PRIVATE APPLICATION INSTANCES</text><rect x="24" y="105" width="168" height="74" rx="10" class="diagram-card"/><text x="42" y="134" class="diagram-title" text-anchor="start">Your domain</text><text x="42" y="157" class="diagram-small" text-anchor="start">HTTPS on port 443</text><path d="M194 142H239" class="diagram-line" marker-end="url(#https-application-arrow)"/><rect x="242" y="105" width="200" height="74" rx="10" class="diagram-accent"/><text x="260" y="134" class="diagram-title" text-anchor="start">HTTPS listener</text><text x="260" y="157" class="diagram-small" text-anchor="start">Uses your certificate</text><path d="M444 142H487" class="diagram-line" marker-end="url(#https-application-arrow)"/><rect x="490" y="105" width="180" height="74" rx="10" class="diagram-card"/><text x="508" y="134" class="diagram-title" text-anchor="start">Backend pool</text><text x="508" y="157" class="diagram-small" text-anchor="start">Checks member health</text><path d="M672 142H713" class="diagram-line" marker-end="url(#https-application-arrow)"/><rect x="716" y="105" width="164" height="74" rx="10" class="diagram-card"/><text x="734" y="134" class="diagram-title" text-anchor="start">Instances</text><text x="734" y="157" class="diagram-small" text-anchor="start">Application port</text><text x="255" y="218" class="diagram-small" text-anchor="start">TLS ends here</text><text x="505" y="218" class="diagram-small" text-anchor="start">Backend traffic uses the pool protocol</text><text x="24" y="273" class="diagram-small" text-anchor="start">Public IP → Application load balancer → reachable backends in the same location.</text></svg>
