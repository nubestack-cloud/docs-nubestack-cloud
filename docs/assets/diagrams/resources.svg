<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="dr-title dr-desc">
  <title id="dr-title">How an organization's resources fit together</title>
  <desc id="dr-desc">The organization Acme has a project, web-shop, in two locations. In Karachi, a public IP points at a load balancer that sends traffic to the instances web-1 and web-2 on the private network app. The instance db-1 on the same network has a volume, db-data, attached. In Islamabad, the same project has its own network app with the instance batch-1. Nothing is shared between the two locations.</desc>
  <defs>
    <marker id="dr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow-teal" d="M0 0L8 4L0 8z"/></marker>
  </defs>
  <rect class="d-box" x="62" y="10" width="150" height="38" rx="19"/>
  <text class="d-title" x="137" y="34" text-anchor="middle">Internet</text>

  <rect class="d-zone" x="10" y="64" width="780" height="396" rx="14"/>
  <text class="d-label" x="772" y="88" text-anchor="end">Organization · Acme</text>
  <rect class="d-box" x="26" y="100" width="748" height="346" rx="12"/>
  <text class="d-label" x="756" y="124" text-anchor="end">Project · web-shop</text>

  <rect class="d-zone" x="42" y="136" width="500" height="296" rx="10"/>
  <text class="d-label" x="526" y="158" text-anchor="end">Karachi · pak-khi-1</text>
  <rect class="d-zone" x="558" y="136" width="200" height="296" rx="10"/>
  <text class="d-label" x="742" y="158" text-anchor="end">Islamabad · pak-isb-1</text>

  <rect class="d-box-teal" x="62" y="172" width="150" height="52" rx="8"/>
  <text class="d-title" x="78" y="194">Public IP</text>
  <text class="d-muted d-mono" x="78" y="213">203.0.113.40</text>
  <rect class="d-box-teal" x="250" y="172" width="180" height="52" rx="8"/>
  <text class="d-title" x="266" y="194">Load balancer</text>
  <text class="d-muted" x="266" y="213">web-lb · HTTPS 443</text>

  <rect class="d-zone-teal" x="62" y="246" width="462" height="120" rx="10"/>
  <text class="d-label" x="78" y="266">Network · app · 10.0.0.0/24</text>
  <rect class="d-box" x="78" y="280" width="130" height="56" rx="8"/>
  <text class="d-title" x="94" y="304">web-1</text>
  <text class="d-muted" x="94" y="323">Instance · 10.0.0.11</text>
  <rect class="d-box" x="222" y="280" width="130" height="56" rx="8"/>
  <text class="d-title" x="238" y="304">web-2</text>
  <text class="d-muted" x="238" y="323">Instance · 10.0.0.12</text>
  <rect class="d-box" x="366" y="280" width="142" height="56" rx="8"/>
  <text class="d-title" x="382" y="304">db-1</text>
  <text class="d-muted" x="382" y="323">Instance · 10.0.0.30</text>
  <rect class="d-box" x="366" y="384" width="142" height="40" rx="8"/>
  <text class="d-title" x="382" y="409">db-data</text>
  <text class="d-muted" x="444" y="409">volume</text>
  <text class="d-muted" x="78" y="394">Security groups filter what</text>
  <text class="d-muted" x="78" y="411">reaches each instance.</text>

  <rect class="d-zone-teal" x="574" y="172" width="168" height="128" rx="10"/>
  <text class="d-label" x="590" y="192">Network · app</text>
  <text class="d-muted d-mono" x="590" y="210">10.0.0.0/24</text>
  <rect class="d-box" x="590" y="224" width="136" height="56" rx="8"/>
  <text class="d-title" x="606" y="248">batch-1</text>
  <text class="d-muted" x="606" y="267">Instance · stopped</text>
  <text class="d-muted" x="574" y="336">Same project, its own</text>
  <text class="d-muted" x="574" y="353">networks, volumes,</text>
  <text class="d-muted" x="574" y="370">public IPs and quota.</text>

  <path class="d-flow" d="M137 48V172" marker-end="url(#dr-arrow)"/>
  <path class="d-flow" d="M212 198H250" marker-end="url(#dr-arrow)"/>
  <path class="d-flow" d="M340 224V238H143V280" marker-end="url(#dr-arrow)"/>
  <path class="d-flow" d="M340 238H287V280" marker-end="url(#dr-arrow)"/>
  <path class="d-line" d="M437 336V384"/>
</svg>
