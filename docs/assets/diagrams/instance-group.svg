<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" role="img" aria-labelledby="dg2-title dg2-desc">
  <title id="dg2-title">An instance group behind a load balancer, sized on a schedule</title>
  <desc id="dg2-desc">The instance group web creates its instances from the launch template web: desired 3, minimum 2, maximum 6, surge 1, so it creates web-1, web-2 and web-3 one at a time. Each instance joins the load balancer pool web-pool on port 8080 once it runs. The load balancer's health checks decide which instances get traffic; the group replaces only instances that failed to run. Two size schedules in the time zone Asia/Karachi change the desired count: 4 instances on weekdays at 08:00, and 2 every day at 22:00, so on a weekday the group runs 2 instances until 08:00, 4 until 22:00 and 2 after.</desc>
