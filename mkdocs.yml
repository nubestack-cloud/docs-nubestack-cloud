site_name: NubeStack Cloud
site_url: https://docs.nubestack.cloud/
site_description: Build with instances, networks and storage in Karachi and Islamabad.
site_author: NubeStack
copyright: NubeStack Cloud · Documentation
strict: true
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/brand/mark.png
  favicon: assets/favicon.png
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
plugins:
  - search
hooks:
  - scripts/hooks.py
extra:
  generator: false
extra_css:
  - assets/stylesheets/documentation.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    absolute_links: relative_to_docs
    anchors: warn
    not_found: warn
    unrecognized_links: warn
nav:
  - Overview: index.md
  - Get started:
      - Create your account: get-started/account.md
      - Your organization: get-started/organizations.md
      - Create a project: get-started/create-a-project.md
      - Your first instance: get-started/first-instance.md
  - Core concepts:
      - Locations: concepts/locations.md
      - Projects and quotas: concepts/projects-and-quotas.md
      - Operations: concepts/operations.md
      - Roles and permissions: concepts/roles-and-permissions.md
      - Tags: concepts/tags.md
      - Usage and costs: concepts/usage-and-costs.md
      - Deletion and retention: concepts/deletion-and-retention.md
      - Limits: concepts/limits.md
  - Compute:
      - Instances: compute/instances.md
      - Manage instances: compute/manage-instances.md
      - SSH keys: compute/ssh-keys.md
      - Images: compute/images.md
      - Server groups: compute/server-groups.md
      - Launch templates: compute/launch-templates.md
      - Instance groups: compute/instance-groups.md
  - Networking:
      - Networks and subnets: networking/networks.md
      - Routing: networking/routing.md
      - Internet gateways: networking/internet-gateways.md
      - Security groups: networking/security-groups.md
      - Public IPs: networking/public-ips.md
      - Load balancers: networking/load-balancers.md
      - Network map: networking/network-map.md
  - Storage:
      - Volumes: storage/volumes.md
      - Snapshots: storage/snapshots.md
      - Schedules: storage/schedules.md
  - Security:
      - Certificates: security/certificates.md
  - Organization:
      - Members and invitations: organization/members.md
      - Custom roles: organization/custom-roles.md
      - Service accounts and API keys: organization/service-accounts.md
      - Quota: organization/quota.md
      - Settings and second factor: organization/settings.md
      - Activity and audit log: organization/activity.md
      - Usage: organization/usage.md
      - Statements and cost explorer: organization/statements-and-costs.md
  - API:
      - Overview: api/overview.md
      - Authentication: api/authentication.md
      - Requests: api/requests.md
      - Operations and polling: api/operations.md
      - Errors: api/errors.md
      - API reference: api/reference/index.md
  - Tools & access:
      - Native OpenStack access:
          - Overview: native-access/overview.md
          - Horizon single sign-on: native-access/horizon.md
          - OpenStack CLI: native-access/openstack-cli.md
      - Tools:
          - NubeStack CLI: tools/cli.md
          - Terraform: tools/terraform.md
  - Help:
      - Troubleshooting: help/troubleshooting.md
      - Glossary: help/glossary.md
      - Support: help/support.md
