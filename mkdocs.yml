site_name: NubeStack Cloud Docs
site_url: https://docs.nubestack.cloud/
site_description: >-
  Guides and reference for NubeStack Cloud: instances, networks, storage, load balancers and
  certificates in Karachi and Islamabad, from the console or the API.
site_author: NubeStack
copyright: Copyright &copy; 2026 NubeStack
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/brand/favicon.svg
  font: false              # self-hosted in docs/assets/fonts (see extra.css); no font CDN
  icon:
    admonition:
      note: material/information-outline
      tip: material/lightbulb-on-outline
      warning: material/alert-outline
      danger: material/alert-octagon-outline
      example: material/console
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use the light theme
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/api-reference.css

extra:
  generator: false

plugins:
  - search

hooks:
  - scripts/hooks.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs/assets/diagrams, includes]
      check_paths: true
      auto_append: [abbreviations.md]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    absolute_links: warn
    anchors: warn
    not_found: warn
    unrecognized_links: warn

